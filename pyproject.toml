[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pandoctylus"
version = "0.1.0"
description = "A crazy and opinionated way of generating documents."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Sebastian Schaetz", email = "seb.schaetz@gmail.com" }
]
dependencies = [
    "pypandoc-binary",
    "docxtpl",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "isort",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["pandoctylus"]
only-include = ["pandoctylus"]
exclude = [
    "pandoctylus-venv",
    ".git",
    ".github",
    ".pytest_cache",
    "tests",
    "examples",
    "doc",
    "dist",
    "build",
    "*.pyc",
    "__pycache__",
    "*.pyo",
    "*.pyd",
    ".DS_Store",
    "~$*.docx"
]
